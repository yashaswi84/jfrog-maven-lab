name: JFrog Token Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Show token lengths
        run: |
          echo "Raw token length: ${#ARTIFACTORY_ACCESS_TOKEN}"
          CLEAN_TOKEN=$(printf "%s" "$ARTIFACTORY_ACCESS_TOKEN" | tr -d '\r\n')
          echo "Clean token length: ${#CLEAN_TOKEN}"
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      - name: Call JFrog API with curl
        run: |
          CLEAN_TOKEN=$(printf "%s" "$ARTIFACTORY_ACCESS_TOKEN" | tr -d '\r\n')
          echo "Calling Artifactory /api/system/version with curl..."
          curl -i \
            -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            "https://yashaswi.jfrog.io/artifactory/api/system/version"
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

