name: Maven build with JFrog

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1) Install JFrog CLI (transparent, no magic)
      - name: Install JFrog CLI
        run: |
          curl -fL https://install-cli.jfrog.io | sh
          sudo mv jf /usr/local/bin/jf
          jf --version

      # 2) Configure JFrog server using the SAME token as ARTIFACTORY_ACCESS_TOKEN
      - name: Configure JFrog CLI
        run: |
          jf c add ci-server \
            --url=https://yashaswi.jfrog.io \
            --access-token="$ARTIFACTORY_ACCESS_TOKEN" \
            --interactive=false
          jf c use ci-server
          jf c show
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      # 3) Quick sanity check: is the token actually used?
      - name: Check authenticated access to Artifactory
        run: |
          echo "Calling /api/system/version via ci-server..."
          jf rt curl api/system/version --server-id=ci-server

      # 4) Configure Maven for Artifactory (project-level .jfrog config)
      - name: Configure Maven for Artifactory
        run: |
          jf mvn-config \
            --server-id-resolve=ci-server \
            --server-id-deploy=ci-server \
            --repo-resolve-releases=maven-virtual \
            --repo-resolve-snapshots=maven-virtual \
            --repo-deploy-releases=maven-local \
            --repo-deploy-snapshots=maven-local

      # 5) Maven build with JFrog CLI
      - name: Maven build with JFrog CLI
        run: |
          jf mvn clean install

      # 6) Publish build-info
      - name: Publish build-info
        run: |
          jf rt bp maven-example-ci $GITHUB_RUN_NUMBER --server-id=ci-server

