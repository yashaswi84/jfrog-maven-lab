name: Maven build with JFrog

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1) Install JFrog CLI and pass URL + token via env
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://yashaswi.jfrog.io
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      # 2) Configure JFrog server and set it as default
      - name: Configure JFrog server
        run: |
          jf c add yashaswi \
            --url=$JF_URL \
            --access-token=$JF_ACCESS_TOKEN \
            --interactive=false
          jf c use yashaswi
        env:
          JF_URL: https://yashaswi.jfrog.io
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}

      # 3) Configure Maven project for Artifactory (in CI workspace)
      - name: Configure Maven for Artifactory
        run: |
          jf mvn-config \
            --server-id-resolve=yashaswi \
            --server-id-deploy=yashaswi \
            --repo-resolve-releases=maven-virtual \
            --repo-resolve-snapshots=maven-virtual \
            --repo-deploy-releases=maven-local \
            --repo-deploy-snapshots=maven-local

      # 4) Verify connectivity
      - name: Run jf rt ping
        run: jf rt ping

      # 5) Maven build with JFrog CLI
      - name: Maven build with JFrog CLI
        run: |
          jf mvn clean install

      # 6) Publish build-info
      - name: Publish build-info
        run: |
          jf rt bp maven-example-ci $GITHUB_RUN_NUMBER
