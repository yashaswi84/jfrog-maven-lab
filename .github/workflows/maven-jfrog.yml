name: Maven build with JFrog (OIDC)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  id-token: write      # Required for OIDC
  contents: read       # Required to checkout the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1) Setup JFrog CLI using OIDC - no static tokens
      - name: Setup JFrog CLI (OIDC)
        id: setup-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: setup-jfrog-cli     # must match Provider Name in JFrog UI
          custom-server-id: ci-oidc               # so we know which server-id to use later

      # 2) Sanity check – confirm CI can talk to Artifactory
      - name: Check authenticated access to Artifactory
        run: |
          echo "Pinging Artifactory via OIDC-configured server..."
          jf rt ping --server-id=ci-oidc
          echo "Calling /api/system/version..."
          jf rt curl api/system/version --server-id=ci-oidc

      # 3) Configure Maven for Artifactory in this workspace
      - name: Configure Maven for Artifactory
        run: |
          jf mvn-config \
            --server-id-resolve=ci-oidc \
            --server-id-deploy=ci-oidc \
            --repo-resolve-releases=maven-virtual \
            --repo-resolve-snapshots=maven-virtual \
            --repo-deploy-releases=maven-local \
            --repo-deploy-snapshots=maven-local

      # 4) Maven build with JFrog CLI
      - name: Maven build with JFrog CLI
        run: |
          jf mvn clean install

      # 5) Publish build-info
      - name: Publish build-info
        run: |
          jf rt bp maven-example-ci $GITHUB_RUN_NUMBER --server-id=ci-oidc

